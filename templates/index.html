<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Downloader</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 560px;
        }
        h1 {
            margin-top: 0;
            color: #1a1a2e;
            font-size: 1.5rem;
        }
        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 1rem;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }
        button:hover:not(:disabled) {
            background: #5a6fd8;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        #status {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            display: none;
        }
        #status.info { display: block; background: #e3f2fd; color: #1565c0; }
        #status.error { display: block; background: #ffebee; color: #c62828; }
        #status.success { display: block; background: #e8f5e9; color: #2e7d32; }
        .download-link {
            display: inline-block;
            margin-top: 8px;
            padding: 10px 20px;
            background: #4caf50;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
        }
        .download-link:hover {
            background: #43a047;
        }
        .hint {
            font-size: 0.8rem;
            color: #888;
            margin-top: 1rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 Video Downloader</h1>
        <p>Fügen Sie eine YouTube-URL ein:</p>
        <div class="form-group">
            <input type="text" id="musicUrl" placeholder="https://www.youtube.com/watch?v=...">
            <button id="downloadBtn" onclick="startDownload()">Video herunterladen</button>
        </div>
        <div id="status"></div>

        <p class="hint">
            Nur für lokale Tests und Bildungszwecke.
        </p>
    </div>

    <script>
        async function startDownload() {
            const urlInput = document.getElementById('musicUrl');
            const btn = document.getElementById('downloadBtn');
            const status = document.getElementById('status');
            const url = urlInput.value.trim();

            if (!url) {
                status.className = 'error';
                status.textContent = 'Bitte geben Sie eine URL ein.';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Lädt...';
            status.className = 'info';
            status.textContent = 'Download wird gestartet... (kann 1-3 Min dauern)';

            try {
                const response = await fetch('/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Unbekannter Fehler');
                }

                status.className = 'success';
                status.innerHTML = `
                    Download erfolgreich!<br>
                    <a class="download-link" href="${data.download_url}" download>📥 MP4 herunterladen</a>
                `;

            } catch (err) {
                status.className = 'error';
                status.textContent = 'Fehler: ' + err.message;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Video herunterladen';
            }
        }

        document.getElementById('musicUrl').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') startDownload();
        });
    </script>
</body>
</html>

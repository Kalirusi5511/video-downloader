<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Downloader - GitHub Pages</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: #f3f4f6; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 480px; }
        h1 { font-size: 1.5rem; color: #111827; margin-bottom: 8px; }
        p { color: #6b7280; font-size: 0.9rem; margin-bottom: 20px; }
        input[type="url"] { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 1rem; margin-bottom: 16px; outline: none; }
        input[type="url"]:focus { border-color: #2563eb; }
        button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #1d4ed8; }
        button:disabled { background: #93c5fd; cursor: not-allowed; }
        #status { margin-top: 16px; font-size: 0.9rem; text-align: center; color: #374151; word-break: break-word; }
    </style>
</head>
<body>
    <div class="card">
        <h1>YouTube Downloader</h1>
        <p>Füge einen YouTube-Link ein, um den Download-Link zu generieren.</p>
        
        <form id="downloadForm">
            <input type="url" id="videoUrl" placeholder="https://www.youtube.com/watch?v=..." required />
            <button type="submit" id="submitBtn">Video Abrufen</button>
        </form>
        
        <div id="status"></div>
    </div>

    <script>
        document.getElementById('downloadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const urlInput = document.getElementById('videoUrl').value;
            const status = document.getElementById('status');
            const btn = document.getElementById('submitBtn');

            status.textContent = "Verarbeitung läuft...";
            btn.disabled = true;

            try {
                // Nutzung der öffentlichen Cobalt API
                const response = await fetch('https://api.cobalt.tools/api/json', {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        url: urlInput,
                        vCodec: 'h264'
                    })
                });

                const data = await response.json();

                if (data.status === 'stream' || data.status === 'redirect') {
                    status.innerHTML = `<a href="${data.url}" target="_blank" style="color: #2563eb; font-weight: bold;">Klicke hier, um das Video herunterzuladen</a>`;
                } else {
                    throw new Error(data.text || 'Fehler beim Abrufen des Videos.');
                }
            } catch (err) {
                status.textContent = "Fehler: " + err.message;
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>

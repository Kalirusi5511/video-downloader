<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Downloader</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: #f3f4f6; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 480px; }
        h1 { font-size: 1.5rem; color: #111827; margin-bottom: 8px; }
        p { color: #6b7280; font-size: 0.9rem; margin-bottom: 20px; }
        input[type="url"] { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 1rem; margin-bottom: 16px; outline: none; }
        input[type="url"]:focus { border-color: #2563eb; }
        button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #1d4ed8; }
        button:disabled { background: #93c5fd; cursor: not-allowed; }
        #status { margin-top: 16px; font-size: 0.9rem; text-align: center; color: #374151; word-break: break-word; }
        .download-link { display: inline-block; margin-top: 10px; padding: 10px 16px; background: #10b981; color: white; border-radius: 6px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h1>YouTube Downloader</h1>
        <p>Füge einen vollständigen YouTube-Link ein.</p>
        
        <form id="downloadForm">
            <input type="url" id="videoUrl" placeholder="https://www.youtube.com/watch?v=..." required />
            <button type="submit" id="submitBtn">Link Generieren</button>
        </form>
        
        <div id="status"></div>
    </div>

    <script>
        document.getElementById('downloadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const urlInput = document.getElementById('videoUrl').value.trim();
            const status = document.getElementById('status');
            const btn = document.getElementById('submitBtn');

            status.textContent = "Verarbeite Link...";
            btn.disabled = true;

            try {
                // Nutzung einer stabilen Proxy-API für direkte Downloads
                const apiEndpoint = `https://api.cobalt.tools/`;
                
                const response = await fetch(apiEndpoint, {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        url: urlInput,
                        videoQuality: '720'
                    })
                });

                if (!response.ok) {
                    throw new Error("API derzeit ausgelastet oder Link nicht erreichbar.");
                }

                const data = await response.json();

                if (data.url) {
                    status.innerHTML = `<a href="${data.url}" class="download-link" target="_blank" rel="noopener noreferrer">Video Herunterladen</a>`;
                } else if (data.picker) {
                    status.innerHTML = `<a href="${data.picker[0].url}" class="download-link" target="_blank" rel="noopener noreferrer">Video Herunterladen</a>`;
                } else {
                    throw new Error("Kein direkter Download-Stream gefunden.");
                }
            } catch (err) {
                // Fallback: Direkte Weiterleitung an Invidious Stream
                const videoIdMatch = urlInput.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
                if (videoIdMatch && videoIdMatch[1]) {
                    const videoId = videoIdMatch[1];
                    status.innerHTML = `
                        <p style="color: #d97706; margin-bottom: 8px;">Direktabruf blockiert. Nutze den Invidious-Mirror:</p>
                        <a href="https://yewtu.be/watch?v=${videoId}" class="download-link" target="_blank" rel="noopener noreferrer">Video auf Invidious öffnen/speichern</a>
                    `;
                } else {
                    status.textContent = "Fehler: Ungültige YouTube-URL. Bitte überprüfe den Link.";
                }
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
